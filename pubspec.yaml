# pubspec.yaml
name: netscope
description: Local network usage monitor for Android and iOS.
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^7.0.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true